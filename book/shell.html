.book{width:100%;max-width:1080px;background:#14110f;border:2px solid #78350f;border-radius:18px;padding:10px;position:relative;

.foot{position:relative;z-index:1;border-top:2px solid rgba(146,64,14,.2);padding-top:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}

dl.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 1em;font-size:15px}

.meter{height:7px;background:rgba(120,53,15,.12);border-radius:4px;overflow:hidden;margin-top:6px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,#b45309,#0e7490)}

.plates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 1em}

.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;padding:20px 0}
.cover .vol{font-family:'Orbitron';font-size:11px;letter-spacing:.35em;color:#b45309}
.cover h2{font-size:clamp(34px,6vw,64px);color:#451a03;letter-spacing:.1em;margin:.2em 0 0;line-height:1.05}

@media(max-width:640px){.viewport{height:auto;min-height:80vh}#pages{overflow:visible}.foot .lbl{display:none}}

body.readall section.page{display:block!important;border-bottom:2px dashed rgba(146,64,14,.3);padding-bottom:30px;margin-bottom:30px}

</style>

<script>
(function(){
  const pages=[...document.querySelectorAll('#pages > section.page')];
  const total=pages.length; let cur=0;
  const $=id=>document.getElementById(id);
  $('ptotal').textContent=total; $('pnum').max=total;

  // Parts
  const parts=[]; pages.forEach((p,i)=>{p.dataset.index=i;const key=p.dataset.part||'';
    if(!parts.length||parts[parts.length-1].key!==key)parts.push({key,title:p.dataset.partTitle||key,start:i,tab:p.dataset.tab||key});});
  const tabs=$('tabs');
  parts.forEach((pt,k)=>{const b=document.createElement('button');b.className='tab';b.textContent=pt.tab;b.title=pt.title;b.onclick=()=>show(pt.start);pt.el=b;tabs.appendChild(b);});
  function partOf(i){let r=parts[0];parts.forEach(p=>{if(i>=p.start)r=p});return r;}

  // TOC
  document.querySelectorAll('[data-widget="toc"]').forEach(box=>{
    const input=document.createElement('input');input.className='toc-filter';input.placeholder='Search chapters, characters, missions…';
    const wrap=document.createElement('div');wrap.className='toc-cols';
    parts.forEach((pt,k)=>{const grp=document.createElement('div');const h=document.createElement('div');h.className='toc-part';h.textContent=pt.title;grp.appendChild(h);
      const end=k+1<parts.length?parts[k+1].start:total;
      for(let i=pt.start;i<end;i++){const p=pages[i];if(p.dataset.toc==='0'||!p.dataset.title)continue;
        const r=document.createElement('div');r.className='toc-row';r.dataset.search=(p.dataset.title+' '+p.textContent).toLowerCase();
        r.innerHTML='<span></span><span class="dots"></span><span class="n"></span>';r.children[0].textContent=p.dataset.title;r.children[2].textContent=i+1;
        r.onclick=()=>show(i);grp.appendChild(r);}
      wrap.appendChild(grp);});
    input.oninput=()=>{const q=input.value.trim().toLowerCase();wrap.querySelectorAll('.toc-row').forEach(r=>{r.style.display=!q||r.dataset.search.includes(q)?'':'none'});};
    box.appendChild(input);box.appendChild(wrap);
  });
  const tocIndex=pages.findIndex(p=>p.querySelector('[data-widget="toc"]'));

  function show(i){
    i=Math.max(0,Math.min(total-1,i)); pages[cur].classList.remove('active'); cur=i; pages[cur].classList.add('active');
    const p=pages[cur], pt=partOf(cur);
    $('run-l').textContent=p.classList.contains('part-opener')?pt.title:(pt.title&&pt.key&&pt.key!=='F'?pt.title+'  //  ':'')+(p.dataset.title||'The Winds of Kirina');
    $('run-r').textContent=p.dataset.chapter||'Kirina Resistance Archive';
    $('pnum').value=cur+1; $('prev').disabled=cur===0; $('next').disabled=cur===total-1;
    $('progress').style.width=((cur+1)/total*100)+'%';
    parts.forEach(x=>x.el.classList.toggle('active',x===pt));
    pt.el.scrollIntoView({block:'nearest',inline:'nearest'});
    $('pages').scrollTop=0;
    try{history.replaceState(null,'','#page-'+(cur+1));localStorage.setItem('kirina-page',cur);}catch(e){}
  }
  window.kirinaGo=n=>show(n-1);
  $('prev').onclick=()=>show(cur-1); $('next').onclick=()=>show(cur+1);
  $('pnum').onchange=e=>show(parseInt(e.target.value,10)-1);
  $('btn-toc').onclick=()=>{if(tocIndex>=0)show(tocIndex)};
  $('btn-all').onclick=()=>{document.body.classList.toggle('readall');$('btn-all').textContent=document.body.classList.contains('readall')?'Page view':'Read all';};
  document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1);});
  let tx=null;$('pages').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  $('pages').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70)show(cur+(dx<0?1:-1));tx=null;});
  document.addEventListener('click',e=>{const a=e.target.closest('[data-goto]');if(a){e.preventDefault();show(parseInt(a.dataset.goto,10)-1);}});

  // Widget: mission planner
  const missions={
    A:{t:'Strategy Alpha: Central Data Heist',type:'Stealth & cyber infiltration',lead:'Dusé & Awa',
      n:'Slip into Data-Mining Cluster 7 and pull the Board of Nine’s manifests: proof of neural subjugation, water theft and the sale of the city’s power by the hour.',
      r:'Layered firewalls. If one trips, the Syndicate locks the Cluster and floods the halls with Enforcers. Dusé can be traced.',
      o:'The leak spreads across Mali. Public unrest weakens J-Sector; the populace meter rises sharply. No new heavy weapons.'},
    B:{t:'Strategy Beta: Convoy Ambush',type:'Heavy vehicular warfare',lead:'Khalil & Awa',
      n:'Hit an armoured Syndicate convoy hauling kinetic rifles and plasma launchers through the rocky canyons south of Kabara.',
      r:'High collateral risk to Azalai traders on the same road. Take too long and gunships arrive.',
      o:'Arms the Kirina Resistance Front for open siege. Weapons tier rises; civilian reputation may fall.'},
    C:{t:'Strategy Gamma: Broadcast Tower Sabotage',type:'All-out assault · critical',lead:'Full strike squad',
      n:'Storm the regional broadcast spire and break the neural blackout dampeners that cut Timbuktu off from Bamako.',
      r:'If the alarms sound, automated sentries ring the ground perimeter while fighter jets saturate the sky. The stealth mission becomes a breakout under air bombardment.',
      o:'The blackout cracks. A narrow, encrypted link to Bamako opens for the first time since 2101, and the road to reunification opens with it.'}
  };
  document.querySelectorAll('[data-widget="mission-planner"]').forEach(box=>{
    box.innerHTML='<div class="grid-3" style="grid-template-columns:1fr"></div>';
    const g=document.createElement('div');g.className='grid-2';g.style.gridTemplateColumns='minmax(0,1fr) minmax(0,2fr)';
    const left=document.createElement('div'),right=document.createElement('div');right.className='card';
    Object.entries(missions).forEach(([k,m])=>{const b=document.createElement('button');b.className='w-btn';b.innerHTML='<span class="tag'+(k==='C'?' red':'')+'">Strategy '+({A:'Alpha',B:'Beta',C:'Gamma'})[k]+'</span><b></b>';b.querySelector('b').textContent=m.t.split(': ')[1];
      b.onclick=()=>{left.querySelectorAll('.w-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
        right.innerHTML='<span class="kicker"></span><h3 style="margin-top:4px"></h3><p></p><div class="callout red"><span class="label">Consequence &amp; escalation risk</span><p></p></div><div class="callout"><span class="label">Strategic outcome</span><p></p></div>';
        right.querySelector('.kicker').textContent=m.type+' · Lead: '+m.lead;right.querySelector('h3').textContent=m.t;
        const ps=right.querySelectorAll('p');ps[0].textContent=m.n;ps[1].textContent=m.r;ps[2].textContent=m.o;};
      left.appendChild(b);});
    g.appendChild(left);g.appendChild(right);box.innerHTML='';box.appendChild(g);left.firstChild.click();
  });

  // Widget: combat sim
  const sims={
    breach:['a|> KHALIL PLANTS SPEAR IN DOOR SEAM...','|> Tether charge: metal door buckles inward, hinges shear.','|> Banco wall behind it cracks; dust and fragments scatter.','|> Energy rifle: 3-round burst staggers a Syndicate Sentry Enforcer.','a|> STATUS: Frontline breach successful.'],
    combo:['p|> DUSÉ HIJACKS SENTRY TURRET (relay 4)...','|> Turret swivels onto Syndicate reinforcements.','c|> AWA WEAVES A TRACE RUNE, TAGS THE VENT...','c|> Anti-materiel shot through the coolant vent.','|> Enforcer core vents; armor plates deform and drop.','a|> STATUS: Target down. No alarm raised.'],
    spear:['c|> SPEAR-LINK: THROW...','|> Spear pins a power node to the spire wall.','|> Node overload: blue arc jumps to three Wardens.','|> Magnetic recall: spear returns to Khalil’s cyber-arm.','a|> STATUS: Shield grid at 0%. Window open: 12s.'],
    air:['r|> ALERT: PERIMETER SENTRIES CLOSING RING...','r|> 2 fighter jets inbound, bearing 040.','p|> Dusé spoofs the IFF on sentry cluster B.','c|> Awa raises a Bogolan barrier over the skiff.','|> Khalil drives through the gap under bombardment.','a|> STATUS: Breakout. Squad intact. Skiff at 31%.']
  };
  document.querySelectorAll('[data-widget="combat-sim"]').forEach(box=>{
    box.className='sim';box.innerHTML='<div class="cinzel" style="color:#fbbf24;font-weight:700;letter-spacing:.1em;margin-bottom:8px">COMBAT LOG SIMULATOR</div><div class="out"><div style="color:#a8a29e">&gt; ENGINE ONLINE. Choose a manoeuvre…</div></div><div class="btns"><button data-s="breach">Heavy breach</button><button class="cy" data-s="spear">Spear-link</button><button class="pu" data-s="combo">Team combo</button><button class="rd" data-s="air">Air-raid breakout</button></div>';
    const out=box.querySelector('.out');let timer=null;
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{clearInterval(timer);out.innerHTML='';const lines=sims[b.dataset.s];let i=0;
      const col={a:'#fbbf24',c:'#67e8f9',p:'#d8b4fe',r:'#fca5a5','':'#e7e5e4'};
      timer=setInterval(()=>{if(i>=lines.length){clearInterval(timer);return;}const [k,t]=lines[i].includes('|')?lines[i].split('|'):['',lines[i]];
        const d=document.createElement('div');d.style.color=col[k]||col[''];d.textContent=t;out.appendChild(d);i++;},380);});
  });

  // Start
  let start=0;const m=location.hash.match(/page-(\d+)/);
  if(m)start=parseInt(m[1],10)-1;else{try{const s=parseInt(localStorage.getItem('kirina-page'),10);if(!isNaN(s))start=s;}catch(e){}}
  show(start);
})();
</script>
</body>
</html>
